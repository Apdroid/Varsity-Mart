      - Orders
    parameters:
    - name: orderId
      in: path
      required: true
      type: string
  /orders/{orderId}/rate:
    post:
      operationId: orders_rate_create
      summary: Rate Order
      description: Submit a rating and review for an order after delivery. Buyers
        can rate both the product and the seller. All reviews are marked as verified
        purchases.
      parameters:
      - name: data
        in: body
        required: true
        schema:
          required:
          - rating
          type: object
          properties:
            rating:
              description: Rating score (1-5 stars)
              type: integer
              example: 4
              maximum: 5
              minimum: 1
            review:
              description: Written review text
              type: string
              example: Great product! Fast shipping and exactly as described.
              maxLength: 1000
            rateProduct:
              description: Whether to rate the product
              type: boolean
              default: true
              example: true
            rateSeller:
              description: Whether to rate the seller
              type: boolean
              default: true
              example: true
      - name: orderId
        in: path
        description: Order number to rate (e.g., ORD-20231201-ABCDEF)
        required: true
        type: string
      responses:
        '201':
          description: Review submitted successfully
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              message:
                type: string
                example: Thank you for your review!
              data:
                type: object
                properties:
                  reviewId:
                    description: ID of the created review
                    type: integer
                    example: 123
        '400':
          description: Validation failed
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Validation failed
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
                example:
                  rating:
                  - Rating must be between 1 and 5.
                  review:
                  - Review cannot exceed 1000 characters.
        '401':
          description: Authentication required
          schema:
            type: object
            properties:
              detail:
                type: string
                example: Authentication credentials were not provided.
        '403':
          description: Permission denied - Not the buyer or user not verified
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Only the buyer can rate this order
        '404':
          description: Order not found
          schema:
            type: object
            properties:
              detail:
                type: string
                example: Not found.
        '409':
          description: Conflict - Order cannot be rated
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                enum:
                - Order must be delivered before rating
                - Order has already been rated
                - Cannot rate cancelled orders
                example: Order must be delivered before rating
      tags:
      - Orders
      - Reviews
    parameters:
    - name: orderId
      in: path
      required: true
      type: string
  /orders/{orderId}/status:
    patch:
      operationId: orders_status_partial_update
      summary: Update Order Status
      description: Update the status of an order. Only the seller of the order can
        perform this action.
      parameters:
      - name: data
        in: body
        required: true
        schema:
          required:
          - status
          type: object
          properties:
            status:
              description: New status for the order
              type: string
              enum:
              - seller_confirmed
              - processing
              - in_transit
              - cancelled
              example: in_transit
            note:
              description: Optional note about the status change
              type: string
              example: 'Order has been shipped via FedEx, tracking number: 123456789'
      - name: orderId
        in: path
        description: Order number to update (e.g., ORD-20231201-ABCDEF)
        required: true
        type: string
      responses:
        '200':
          description: Order status updated successfully
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              message:
                type: string
                example: Order status updated
              data:
                type: object
                properties:
                  orderId:
                    type: string
                    example: ORD-20231201-ABCDEF
                  status:
                    type: string
                    enum:
                    - seller_confirmed
                    - processing
                    - in_transit
                    - cancelled
                    example: in_transit
                  previous_status:
                    type: string
                    example: processing
                  escrow_status:
                    type: string
                    enum:
                    - held
                    - released
                    - refunded
                    example: held
        '400':
          description: Validation failed - Invalid transition or missing fields
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Validation failed
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
                example:
                  status:
                  - Cannot transition from 'in_transit' to 'processing'
                  note:
                  - Note cannot exceed 500 characters.
        '401':
          description: Authentication required
          schema:
            type: object
            properties:
              detail:
                type: string
                example: Authentication credentials were not provided.
        '403':
          description: Permission denied - Not the seller or user not verified
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Only the seller can update order status
        '404':
          description: Order not found
          schema:
            type: object
            properties:
              detail:
                type: string
                example: Not found.
        '409':
          description: Conflict - Invalid status transition
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Cannot transition from 'in_transit' to 'processing'
      tags:
      - Orders
    parameters:
    - name: orderId
      in: path
      required: true
      type: string
