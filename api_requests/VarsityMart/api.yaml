  /devices/register/:
    post:
      operationId: devices_register_create
      summary: Register/Update Device
      description: |2

        Register a new device or update existing device with push notification token.

        **Token Type Detection:**
        - For iOS devices, the system automatically detects APN tokens based on format:
          - 64-character hexadecimal strings (traditional APN tokens)
          - Strings starting with 'APNS' (newer APN tokens)
        - All other devices use FCM tokens by default

        **Note:** The frontend continues to send 'fcm_token' field for all devices.
        The backend automatically determines if it's an FCM or APN token based on format.
      parameters:
      - name: data
        in: body
        required: true
        schema:
          required:
          - fcm_token
          - device_type
          type: object
          properties:
            fcm_token:
              description: |2

                Push notification token for the device.
                - For Android/Web: Firebase Cloud Messaging (FCM) token
                - For iOS: Can be either FCM token (via Firebase iOS SDK) or APN token
                The system automatically detects the token type based on format.
              type: string
              example: fcm_token_1234567890abcdef_or_apn_token_64_hex_chars
            device_type:
              description: Type of device being registered
              type: string
              enum:
              - web
              - android
              - ios
            device_id:
              description: Optional unique identifier for the device. If provided,
                updates existing device with same device_id.
              type: string
              example: device_001
      - name: Authorization
        in: header
        description: Bearer token for authentication
        required: true
        type: string
      responses:
        '200':
          description: Device updated successfully
          schema:
            $ref: '#/definitions/Device'
          examples:
            application/json:
              id: 123e4567-e89b-12d3-a456-426614174000
              user_id: 123e4567-e89b-12d3-a456-426614174001
              fcm_token: fcm_or_apn_token_here
              token_type: fcm
              device_type: ios
              device_id: iphone_12_user123
              is_active: true
              created_at: '2024-01-15T10:30:00Z'
        '201':
          description: Device registered successfully
          schema:
            $ref: '#/definitions/Device'
          examples:
            application/json:
              id: 123e4567-e89b-12d3-a456-426614174000
              user_id: 123e4567-e89b-12d3-a456-426614174001
              fcm_token: fcm_or_apn_token_here
              token_type: apn
              device_type: ios
              device_id: iphone_12_user123
              is_active: true
              created_at: '2024-01-15T10:30:00Z'
        '400':
          description: Bad Request - Invalid data or missing required fields
          schema:
            type: object
            properties:
              fcm_token:
                description: Validation errors for fcm_token field
                type: array
                items:
                  type: string
              device_type:
                description: Validation errors for device_type field
                type: array
                items:
                  type: string
        '401':
          description: Unauthorized - Authentication required
          schema:
            type: object
            properties:
              detail:
                type: string
                example: Authentication credentials were not provided.
      tags:
      - Devices
      security:
      - Bearer: []
    patch:
      operationId: devices_register_partial_update
      summary: Update device registration
      description: |2

        Update existing device registration for sending notifications.

        Can update fcm_token, device_type, or device_id.
        Token type is auto-detected for iOS devices.
      parameters:
      - name: data
        in: body
        required: true
        schema:
          type: object
          properties:
            fcm_token:
              description: New push notification token for the device
              type: string
            device_type:
              description: New device type
              type: string
              enum:
              - web
              - android
              - ios
            device_id:
              description: New device identifier
              type: string
      responses:
        '200':
          description: Device updated successfully
          schema:
            $ref: '#/definitions/Device'
        '400':
          description: Invalid data
          schema:
            type: object
            properties:
              error:
                type: string
        '404':
          description: Device not found
          schema:
            type: object
            properties:
              error:
                type: string
      tags:
      - devices
    delete:
      operationId: devices_register_delete
      summary: Unregister Device
      description: Unregister a device by device_id or fcm_token. At least one parameter
        is required.
      parameters:
      - name: data
        in: body
        required: true
        schema:
          type: object
          properties:
            device_id:
              description: Device identifier to unregister
              type: string
              example: device_001
            fcm_token:
              description: Push notification token to unregister (FCM or APN)
              type: string
              example: fcm_token_1234567890abcdef
      responses:
        '200':
          description: Device unregistered successfully
          schema:
            type: object
            properties:
              message:
                type: string
                example: Device unregistered successfully
        '400':
          description: Bad Request
          schema:
            type: object
            properties:
              error:
                type: string
                example: device_id or fcm_token is required
        '401':
          description: Unauthorized - Authentication required
      tags:
      - Devices
      security:
      - Bearer: []
    parameters: []
