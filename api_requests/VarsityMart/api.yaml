          description: Order delivery confirmed successfully
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              message:
                type: string
                example: Order delivery confirmed. Escrow released to seller.
              data:
                type: object
                properties:
                  orderId:
                    type: string
                    example: ORD-20231201-ABCDEF
                  status:
                    type: string
                    enum:
                    - pending
                    - processing
                    - shipped
                    - delivered
                    - cancelled
                    example: delivered
                  escrowStatus:
                    description: Status of the escrow payment
                    type: string
                    enum:
                    - held
                    - released
                    - refunded
                    example: released
        '400':
          description: Bad request - Order cannot be confirmed in current status
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Order cannot be confirmed in pending status
        '401':
          description: Authentication required
          schema:
            type: object
            properties:
              detail:
                type: string
                example: Authentication credentials were not provided.
        '403':
          description: Permission denied - Not the buyer or user not verified
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Only the buyer can confirm delivery
        '404':
          description: Order not found
          schema:
            type: object
            properties:
              detail:
                type: string
                example: Not found.
        '409':
          description: Conflict - Auto-confirmation period not elapsed
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Delivery confirmation not available. Auto-confirmation in
