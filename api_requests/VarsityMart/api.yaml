swagger: '2.0'
info:
  title: VARSITYMART API
  description: "\n# VarsityMart - Campus Marketplace API\n\n## Authentication\nThis
    API uses JWT authentication.\n\n### Getting Started:\n1. Register at `/v1/auth/register/`\n2.
    Verify email at `/v1/auth/verify-email/`\n3. Login at `/v1/auth/login/` to get
    tokens\n4. Use token: `Authorization: Bearer {token}`\n\n## Account Capabilities\nEvery
    account is created as a regular **user** (buyer-by-default —\nanyone authenticated
    can purchase). Selling is an additive\ncapability: users opt in via the \"Become
    a Seller\" flow and are\ngranted seller permissions once an admin approves their
    KYC.\n\nInternal staff roles set manually by admins:\n- **admin**: Platform administration\n-
    **delivery**: Delivery partner\n\n## University Requirements\n- Students must
    use university email (.edu., .edu.gh, .ac.gh)\n- Student ID required for verification\n\n##
    \ WebSocket Chat API\n\n**Interactive Test Client:** [Open WebSocket Chat Tester](/websocket-test/)
    \ \n**Full Documentation:** [WebSocket API Reference](/websocket-docs/)\n\n> The
    WebSocket API handles real-time messaging between users (buyers, sellers, and
    delivery partners).\n\n### Quick Connection Info\n```\nDevelopment: ws://127.0.0.1:8000/ws/chat/{conversation_id}/\nProduction:
    wss://api.varsitymart.org/ws/chat/{conversation_id}/\n```\n\n### Authentication\nThe
    WebSocket automatically reads the JWT from the HttpOnly cookie set during login.
    No token parameter needed!\nThe browser automatically sends cookies on WebSocket
    connections to the same domain.\n\n"
  termsOfService: https://www.varsitymart.org/terms/
  contact:
    email: manfredyegbe@gmail.com
  license:
    name: BSD License
  version: v1
host: 127.0.0.1:8001
schemes:
- http
basePath: /v1
consumes:
- application/json
produces:
- application/json
securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header
security:
- Bearer: []
paths:
  /admin/cleanup-stats/:
    get:
      operationId: admin_cleanup-stats_list
      description: ''
      parameters: []
      responses:
        '200':
          description: ''
      tags:
      - admin
    parameters: []
  /admin/flagged-messages/:
    get:
      operationId: admin_flagged-messages_list
      description: List flagged messages with optional filters for days and reason.
        Admin only.
      parameters:
      - name: days
        in: query
        description: Number of days to look back
        type: integer
        default: 7
      - name: reason
        in: query
        description: Filter by flag reason (spam, contact_info, inappropriate)
        type: string
      - name: page
        in: query
        description: Page number
        type: integer
        default: 1
      - name: limit
        in: query
        description: Page size
        type: integer
        default: 50
      responses:
        '200':
          description: Flagged messages and totals
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      type: object
                  totals:
                    type: object
                  pagination:
                    type: object
        '403':
          description: Admin privileges required
      tags:
      - admin
      security:
      - Bearer: []
    parameters: []
  /admin/kyc/pending/:
    get:
      operationId: admin_kyc_pending_list
      summary: List Pending KYC Applications
      description: |2

        Returns every user whose KYC review is currently in `pending` state,
        ordered by submission time (oldest first).

        ### Notes:
        - Requires **staff / admin** credentials.
        - `seller_type` is derived from whether the user has a pending Store (`products`)
          or Restaurant (`food`) record. It may be `null` if no linked record is found.
        - `kyc_document_type` is always `null` until a dedicated KYC submission model
          is added; clients should degrade gracefully.
      parameters: []
      responses:
        '200':
          description: List of pending KYC applicants
          examples:
            application/json:
              success: true
              data:
              - id: 123e4567-e89b-12d3-a456-426614174000
                name: Kofi Mensah
                email: kofi@ug.edu.gh
                seller_type: products
                submitted_at: '2026-05-01T08:30:00.000000+00:00'
                kyc_document_type: null
        '401':
          description: Authentication credentials were not provided.
        '403':
          description: You do not have permission to perform this action.
      tags:
      - Admin — KYC Review
    parameters: []
  /admin/kyc/{userId}/review/:
    patch:
      operationId: admin_kyc_review_partial_update
      summary: Approve or Reject a KYC Application
      description: |2

        Approves or rejects the seller KYC application for the specified user.

        ### Approve (`action: "approve"`):
        1. Sets `kyc_status` → `approved` and records `kyc_verified_at`.
        2. Activates the user's pending Store (subscription status → active) or
           Restaurant record and flips `has_store` / `has_restaurant` accordingly.
        3. Sends an approval email to the applicant.

        ### Reject (`action: "reject"`):
        1. Sets `kyc_status` → `rejected`.
        2. Deletes the pending Store / Restaurant records so the user can re-apply cleanly.
        3. Sends a rejection email to the applicant (with optional `notes` as the reason).

        ### Notes:
        - Requires **staff / admin** credentials.
        - The email notification is best-effort; an SMTP failure will be logged but will
          **not** roll back the review decision.
        - The entire state change runs inside an atomic transaction with a row-level lock
          on the user record to prevent concurrent reviews.
      parameters:
      - name: data
        in: body
        required: true
        schema:
          $ref: '#/definitions/_KYCAction'
      - name: userId
        in: path
        description: UUID of the user whose KYC application is being reviewed.
        required: true
        type: string
        format: uuid
      responses:
        '200':
          description: Review decision applied successfully
          examples:
            application/json:
              success: true
              data:
                id: 123e4567-e89b-12d3-a456-426614174000
                kyc_status: approved
                kyc_submitted_at: '2026-05-01T08:30:00.000000+00:00'
                kyc_verified_at: '2026-05-03T10:00:00.000000+00:00'
                has_store: true
                has_restaurant: false
        '404':
          description: User not found
          examples:
            application/json:
              success: false
              message: User not found
        '400':
          description: Invalid request body (e.g. unknown action).
        '401':
          description: Authentication credentials were not provided.
        '403':
          description: You do not have permission to perform this action.
      tags:
      - Admin — KYC Review
    parameters:
    - name: userId
      in: path
      required: true
      type: string
  /admin/message-reports/:
    get:
      operationId: admin_message-reports_list
      description: List message reports with optional reviewed filter and pagination.
        Admin only.
      parameters:
      - name: reviewed
        in: query
        description: Filter by reviewed status (true/false)
        type: string
      - name: days
        in: query
        description: Number of days to look back
        type: integer
        default: 7
      - name: page
        in: query
        description: Page number
        type: integer
        default: 1
      - name: limit
        in: query
        description: Page size
        type: integer
        default: 50
      responses:
        '200':
          description: Message reports list
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
        '403':
          description: Admin privileges required
      tags:
      - admin
      security:
      - Bearer: []
    parameters: []
  /admin/message-reports/{report_id}/review/:
    post:
      operationId: admin_message-reports_review_create
      description: Review a message report and take action (approve, reject, take_action).
        Admin only.
      parameters:
      - name: data
        in: body
        required: true
        schema:
          required:
          - action
          type: object
          properties:
            action:
              description: approve | reject | take_action
              type: string
              example: approve
            action_taken:
              description: Optional description of action taken
              type: string
            user_action:
              description: 'Target user for action: reporter | sender'
              type: string
      - name: report_id
        in: path
        description: UUID of the report
        required: true
        type: string
        format: uuid
      responses:
        '200':
          description: Action taken
        '400':
          description: Invalid action
        '404':
          description: Report not found
      tags:
      - admin
      security:
      - Bearer: []
    parameters:
    - name: report_id
      in: path
      required: true
      type: string
  /admin/trigger-cleanup/:
    post:
      operationId: admin_trigger-cleanup_create
      description: Manually trigger cleanup task
      parameters: []
      responses:
        '201':
          description: ''
      tags:
      - admin
    parameters: []
  /auth/become-a-seller/:
    post:
      operationId: auth_become-a-seller_create
      summary: Submit Seller Activation Request
      description: |2

        Submit an application to become a seller on VarsityMart.

        ### Process:
        1. User must have a verified email before applying.
        2. A pending **Store** (for `products`) or **Restaurant** (for `food`) record is created.
        3. The user's `kyc_status` is set to `pending` until an admin approves or rejects it.
        4. No role change occurs — the existing session and JWT remain valid throughout.

        ### Constraints:
        - The user must **not** already own a store or restaurant.
        - A user with `kyc_status` of `pending` or `approved` cannot re-apply.
        - `bank_or_momo_details`, `kyc_document_type`, and `kyc_document_number` are
          collected for manual admin review and are **not** persisted on the user record.
      parameters:
      - name: data
        in: body
        required: true
        schema:
          $ref: '#/definitions/RequestSellerActivation'
      responses:
        '201':
          description: Application submitted successfully
          examples:
            application/json:
              message: Your seller application has been submitted. We'll review it
                within 24-48 hours.
              seller_type: products
              kyc_status: pending
        '400':
          description: Bad request — duplicate application or already a seller
          examples:
            application/json:
              message: Your seller application is already under review.
        '403':
          description: Email not verified
          examples:
            application/json:
              message: Please verify your email before becoming a seller.
        '401':
          description: Authentication credentials were not provided.
      tags:
      - Seller Activation
    parameters: []
  /auth/check-status/:
    get:
      operationId: auth_check-status_list
      summary: Check Authentication Status
      description: |2

        Check if the current request has valid authentication cookies.

        ### What it checks:
        1. Valid access token in HTTP-only cookie
        2. User account status (active, verified)
        3. Returns minimal user information

        ### Use Cases:
        - App initialization to check login state
        - Periodic authentication checks
        - Detecting expired sessions
        - Getting current user info without full profile

        ### Response includes:
        - Whether user is authenticated
        - Basic user information
        - Token expiration information
        - Account status flags
      parameters: []
      responses:
        '200':
          description: Authentication status
          examples:
            application/json:
              success: true
              data:
                isAuthenticated: true
                user:
                  id: 123e4567-e89b-12d3-a456-426614174000
                  email: user@example.com
                  firstName: John
                  lastName: Doe
                  role: user
                  isVerified: true
                tokens:
                  accessExpiresIn: 300
                  refreshExpiresIn: 604800
        '401':
          description: Not authenticated
          examples:
            application/json:
              success: true
              data:
                isAuthenticated: false
                user: null
                tokens: null
      tags:
      - Authentication
      security: []
    parameters: []
  /auth/forgot-password/:
    post:
      operationId: auth_forgot-password_create
      summary: Request Password Reset
      description: |2

        Request a password reset link to be sent to the user's email address.

        ### Process:
        1. User provides registered email address
        2. System generates unique reset token (valid for 24 hours)
        3. Reset link with token is sent to the email
        4. User clicks link to reset password

        ### Security Features:
        - Reset tokens are unique UUIDs
        - Tokens expire after 24 hours for security
        - Each token can only be used once
        - No indication if email doesn't exist (prevents user enumeration)

        ### Rate Limiting:
        - Limited to 3 requests per email per hour
        - Global rate limiting applied to prevent abuse

        ### Email Content:
        The email will contain:
        - Password reset link with token
        - User's full name for personalization
        - Token expiry information (24 hours)
        - Security notice about unsolicited requests
      parameters:
      - name: data
        in: body
        required: true
        schema:
          required:
          - email
          type: object
          properties:
            email:
              description: Registered email address to send reset link
              type: string
              format: email
              example: student@university.edu.gh
          example:
            email: student@university.edu.gh
      responses:
        '200':
          description: Password reset email sent successfully
          examples:
            application/json:
              success: true
              message: Password reset link sent to your email
              data:
                email: student@university.edu.gh
                expiresIn: 24 hours
                sentAt: '2024-01-15T10:30:00Z'
        '400':
          description: Bad Request - Validation Error
          examples:
            application/json:
              success: false
              errors:
                email:
                - Enter a valid email address.
        '404':
          description: Not Found - Security Response
          examples:
            application/json:
              success: true
              message: If an account exists with this email, a reset link has been
                sent.
        '429':
          description: Too Many Requests - Rate limit exceeded
          examples:
            application/json:
              success: false
              message: Too many reset requests. Please try again in 1 hour.
      tags:
      - Authentication
      security: []
    parameters: []
  /auth/login/:
    post:
      operationId: auth_login_create
      summary: User Login
      description: |2

        Authenticate a user with email and password.

        ### Authentication Flow:
        1. User provides email and password
        2. System validates credentials
        3. If successful, returns JWT tokens
        4. User can use access token for subsequent requests

        ### Verification Requirements:
        - **Email/Password users**: Must verify email before login
        - **Google OAuth users**: No email verification required

        ### Account Status Checks:
        - Account must be active (`is_active=True`)
        - Email must be verified (for credentials auth)
        - Account must not be suspended

        ### Token Information:
        - **access_token**: Used for API authentication (60 minutes )
        - **refresh_token**: Used to obtain new access tokens (7 days)

        ### Headers for Authenticated Requests:
        ```
        Authorization: Bearer <access_token>
        ```

        ### Rate Limiting:
        - 5 failed attempts within 15 minutes triggers temporary lockout
        - Use password reset if account is locked
      parameters:
      - name: data
        in: body
        required: true
        schema:
          required:
          - email
          - password
          type: object
          properties:
            email:
              description: User's registered email address
              type: string
              format: email
              example: student@university.edu.gh
              maxLength: 255
            password:
              description: User's password
              type: string
              format: password
              example: SecurePassword123
              writeOnly: true
          example:
            email: john.doe@university.edu.gh
            password: SecurePass123
      responses:
        '200':
          description: Login successful
          examples:
            application/json:
              success: true
              message: Login successful
              data:
                user:
                  id: 123e4567-e89b-12d3-a456-426614174000
                  firstName: John
                  lastName: Doe
                  email: john.doe@university.edu.gh
                  phone: '+233201234567'
                  avatar: ''
                  isVerified: true
                  kycStatus: verified
                  role: user
                  rating: 4.5
                  university: University of Ghana
                  campus: Legon
                  studentId: UGBS123456
                  hasStore: false
                  hasRestaurant: false
                  totalReviews: 10
        '400':
          description: Bad Request - Validation Error
          examples:
            application/json:
              success: false
              errors:
                email:
                - This field is required.
                password:
                - This field is required.
        '401':
          description: Unauthorized - Authentication Failed
          examples:
            application/json:
            - success: false
              errors:
                email:
                - No user found with this email address.
            - success: false
              errors:
                password:
                - Invalid password.
            - success: false
              errors:
                account:
                - This account has been deactivated.
            - success: false
              errors:
                email:
                - Please verify your email address before logging in.
        '403':
          description: Forbidden - Account Locked
          examples:
            application/json:
              success: false
              errors:
                account:
                - Account temporarily locked due to too many failed attempts. Try
                  again in 15 minutes.
        '429':
          description: Too Many Requests
          examples:
            application/json:
              success: false
              errors:
                detail: Too many login attempts. Please try again later.
      tags:
      - Authentication
      security: []
    parameters: []
  /auth/logout/:
    post:
      operationId: auth_logout_create
      summary: User Logout
      description: |2

        Logout user and invalidate refresh token.

        ### Logout Types:
        1. **Single Device Logout**: Invalidates the provided refresh token only
        2. **Multi-Device Logout**: Optionally blacklist all user's refresh tokens

        ### What Happens:
        - Provided refresh token is blacklisted (cannot be used again)
        - Access token remains valid until expiration (cannot be revoked immediately)
        - User must provide credentials to login again
        - Optional: Can blacklist all user's refresh tokens for complete logout

        ### Security Notes:
        - This endpoint requires a valid access token
        - Blacklisting prevents refresh token reuse
        - Access tokens cannot be immediately invalidated (JWT limitation)
        - Consider using short access token lifetimes (15-30 minutes)

        ### Multiple Device Considerations:
        - Logout on one device doesn't affect other devices
        - For complete logout from all devices, use logout_all endpoint
        - Users can see active sessions in their profile

        ### After Logout:
        - User cannot refresh access token with blacklisted refresh token
        - API requests with expired access token will fail
        - User must login again for new tokens
      parameters:
      - name: data
        in: body
        required: true
        schema:
          required: []
          type: object
          properties:
            refresh_token:
              description: Refresh token to blacklist (optional for single device
                logout)
              type: string
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            logout_all:
              description: If true, blacklists all refresh tokens for this user
              type: boolean
              default: false
          example:
            refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            logout_all: false
      responses:
        '200':
          description: Logout successful
          examples:
            application/json:
            - success: true
              message: Logged out successfully
              data:
                logoutType: single_device
                tokensBlacklisted: 1
                loggedOutAt: '2024-01-15T10:30:00Z'
            - success: true
              message: Logged out successfully from all devices
              data:
                logoutType: all_devices
                tokensBlacklisted: 3
                loggedOutAt: '2024-01-15T10:30:00Z'
        '400':
          description: Bad Request
          examples:
            application/json:
              success: false
              errors:
                refresh_token:
                - This field is required for single device logout.
        '401':
          description: Unauthorized
          examples:
            application/json:
              success: false
              errors:
                detail: Authentication credentials were not provided.
        '403':
          description: Forbidden
          examples:
            application/json:
              success: false
              errors:
                detail: You do not have permission to perform this action.
      tags:
      - Authentication
      security:
      - Bearer: []
    parameters: []
  /auth/refresh-token/:
    post:
      operationId: auth_refresh-token_create
      description: ''
      parameters: []
      responses:
        '201':
          description: ''
      tags:
      - auth
    parameters: []
  /auth/register/:
    post:
      operationId: auth_register_create
      summary: User Registration
      description: |2

        Register a new user on VarsityMart.

        - **Student registration**: If `is_student` is `true`, `student_id` is required.
        - **Email domain**: Students must use a university email (containing `.edu`, `.edu.gh`, or `.ac.gh`). Disposable email domains are blocked.
        - **Verification**: A 6‑digit verification code is sent to the email address. The code expires after 24 hours.
        - **Authentication method**: Default is `credentials` (email + password). If `google` is used, the user is created without password (OAuth flow handled separately).
        - **Cookies**: On success, HTTP‑only cookies containing JWT tokens are set automatically.

        **Note:** Even if the verification email fails to send immediately, the registration is still considered successful and a background task will retry sending it.
      parameters:
      - name: data
        in: body
        required: true
        schema:
          required:
          - firstName
          - lastName
          - email
          - phone
          - password
          - confirmPassword
          - university
          - campus
          - agreeToTerms
          type: object
          properties:
            firstName:
              description: User's first name
              type: string
              example: John
            lastName:
              description: User's last name
              type: string
              example: Doe
            email:
              description: Email address (must be valid and not disposable)
              type: string
              format: email
              example: john.doe@university.edu.gh
            phone:
              description: Phone number with country code
              type: string
              example: '+233201234567'
            password:
              description: Password (min. 8 characters)
              type: string
              format: password
              example: SecurePass123
              minLength: 8
            confirmPassword:
              description: Must match password field
              type: string
              format: password
              example: SecurePass123
            studentId:
              description: Required if `isStudent` is `true`
              type: string
              example: UGBS123456
            isStudent:
              description: Whether the user is a student
              type: boolean
              default: true
            university:
              description: Name of the university
              type: string
              example: University of Ghana
            campus:
              description: Campus location
              type: string
              example: Legon
            agreeToTerms:
              description: Must be `true` to register
              type: boolean
              default: false
            authMethod:
              description: 'Authentication method (default: credentials)'
              type: string
              enum:
              - credentials
              - google
              default: credentials
            profilePic:
              description: URL to profile picture (optional)
              type: string
              format: uri
              nullable: true
      responses:
        '201':
          description: Registration successful (user created, cookies set)
          examples:
            application/json:
              success: true
              message: Registration successful. Please verify your email within 3
                hours.
              data:
                userId: 123e4567-e89b-12d3-a456-426614174000
                user:
                  id: 123e4567-e89b-12d3-a456-426614174000
                  firstName: John
                  lastName: Doe
                  email: john.doe@university.edu.gh
                  phone: '+233201234567'
                  avatar: ''
                  isVerified: false
                  role: user
                  verificationExpiry: '2026-03-01T03:15:00+00:00'
                  accountExpiry: '2026-03-01T03:15:00+00:00'
                  timeRemaining: 10800
        '400':
          description: Validation error (missing fields, invalid data, disposable
            email, etc.)
          examples:
            application/json:
              success: false
              errors:
                email:
                - Enter a valid email address.
                password:
                - This password is too short.
                confirmPassword:
                - Passwords do not match.
                studentId:
                - Student ID is required for students.
                agreeToTerms:
                - You must agree to the terms and conditions.
        '409':
          description: Conflict – user with this email or phone already exists
          examples:
            application/json:
              success: false
              errors:
                email:
                - user with this email address already exists.
                phone:
                - user with this phone number already exists.
        '500':
          description: Unexpected server error (e.g., database issue before user creation)
          examples:
            application/json:
              success: false
              message: Registration failed due to server error
              errors:
                non_field_errors:
                - An unexpected error occurred
      tags:
      - Authentication
    parameters: []
  /auth/resend-verification/:
    post:
      operationId: auth_resend-verification_create
      summary: Resend Verification Email
      description: |2

        Resend a new 6-digit OTP verification code with 3-hour account expiry reminder.

        ### Important Notes:
        - Previous verification code is invalidated
        - New code has 24-hour validity period
        - Account will be deleted if not verified within 3 hours
        - Rate limited to prevent abuse (max 3 requests per hour)

        ### Email Content Includes:
        - New 6-digit OTP verification code
        - 3-hour account expiry warning
        - Time remaining for verification
        - Account deletion consequences

        ### Account Expiry Timeline:
        1. Registration: 3-hour timer starts
        2. Resend email: Timer does NOT reset
        3. 3 hours pass: Account automatically deleted
        4. Email becomes available for re-registration
      parameters: []
      responses:
        '200':
          description: Verification email sent successfully
          examples:
            application/json:
              success: true
              message: Verification email sent
              data:
                email: student@university.edu.gh
                sentAt: '2024-01-15T10:30:00Z'
                codeExpiresIn: 24 hours
                accountExpiresIn: 2 hours 45 minutes
                accountExpiresAt: '2024-01-15T13:15:00Z'
                attemptsRemaining: 2
        '400':
          description: Bad Request - Email already verified
          examples:
            application/json:
              success: false
              message: Email is already verified.
        '410':
          description: Account Expired - Deleted
          examples:
            application/json:
              success: false
              message: Account has expired. Please register again.
        '429':
          description: Too Many Requests - Rate limit exceeded
          examples:
            application/json:
              success: false
              message: Too many resend attempts. Please try again in 45 minutes.
      tags:
      - Authentication
      security:
      - Bearer: []
    parameters: []
  /auth/reset-password/:
    post:
      operationId: auth_reset-password_create
      summary: Reset Password
      description: |2

        Reset user password using the token received via email.

        ### Requirements:
        1. Valid reset token from email link
        2. New password (minimum 8 characters)
        3. Password confirmation

        ### Security Features:
        - Token must be valid and not expired (24-hour validity)
        - Token can only be used once (single-use)
        - All existing sessions are invalidated after reset
        - Previous passwords cannot be reused
        - Strong password validation enforced

        ### Token Validation:
        The token is validated for:
        - Existence in database
        - Not expired (24 hours from creation)
        - Not previously used
        - Associated with valid user account

        ### After Successful Reset:
        1. User password is updated
        2. Reset token is marked as used
        3. All existing JWT refresh tokens are blacklisted
        4. User must login with new password

        ### Note:
        This endpoint does not require authentication since the user
        may not be logged in when resetting password.
      parameters:
      - name: data
        in: body
        required: true
        schema:
          required:
          - reset_token
          - new_password
          - confirm_password
          type: object
          properties:
            reset_token:
              description: Reset token received via email link
              type: string
              example: 123e4567-e89b-12d3-a456-426614174000
            new_password:
              description: New password (minimum 8 characters)
              type: string
              format: password
              example: NewSecurePass123
              minLength: 8
            confirm_password:
              description: Must match new_password field
              type: string
              format: password
              example: NewSecurePass123
          example:
            reset_token: 123e4567-e89b-12d3-a456-426614174000
            new_password: NewSecurePass123
            confirm_password: NewSecurePass123
      responses:
        '200':
          description: Password reset successful
          examples:
            application/json:
              success: true
              message: Password reset successful
              data:
                email: student@university.edu.gh
                resetAt: '2024-01-15T10:30:00Z'
                sessionInvalidated: true
        '400':
          description: Bad Request - Validation Error
          examples:
            application/json:
            - success: false
              errors:
                reset_token:
                - This field is required.
            - success: false
              errors:
                new_password:
                - Password must be at least 8 characters.
            - success: false
              errors:
                confirm_password:
                - Passwords do not match.
            - success: false
              errors:
                reset_token:
                - Invalid or expired reset token.
            - success: false
              errors:
                reset_token:
                - This reset token has already been used.
            - success: false
              errors:
                reset_token:
                - Reset token has expired.
        '410':
          description: Gone - Token expired
          examples:
            application/json:
              success: false
              errors:
                reset_token:
                - Reset token has expired. Please request a new one.
      tags:
      - Authentication
      security: []
    parameters: []
  /auth/seller-status/:
    get:
      operationId: auth_seller-status_list
      summary: Get Seller Activation Status
      description: |2

        Returns the seller-capability snapshot for the currently authenticated user.

        ### Response fields:
        - **kyc_status**: Current KYC review state (`none`, `pending`, `approved`, `rejected`).
        - **has_store**: Whether the user owns an active product store.
        - **has_restaurant**: Whether the user owns an active restaurant.
        - **seller_type**: Derived seller type — `products`, `food`, or `null` if not a seller yet.
        - **submitted_at**: ISO-8601 timestamp of the KYC submission, or `null` if not submitted.
      parameters: []
      responses:
        '200':
          description: Seller status snapshot
          examples:
            application/json:
              kyc_status: pending
              has_store: false
              has_restaurant: false
