  /users/me/:
    get:
      operationId: users_me_read
      summary: Get User Profile
      description: |2

        Get authenticated user's complete profile information.

        ### Profile Information Includes:
        - **Personal Details**: Full name, email, phone, avatar
        - **University Information**: Student ID, campus, university
        - **Account Status**: Verification status, KYC status, role
        - **Performance Metrics**: Rating, total reviews, response rate/time
        - **Business Information**: Store/restaurant flags
        - **Timestamps**: Member since date

        ### Avatar URL:
        - Returns absolute URL for profile picture
        - Falls back to generated avatar if no picture
        - Includes both `profile_pic` and `avatarUrl` fields

        ### Authentication Required:
        - Valid JWT access token required
        - Returns profile of authenticated user only

        ### Response Rate/Time:
        These are currently mock values and will be replaced with actual
        metrics from order/response tracking system.
      parameters: []
      responses:
        '200':
          description: Profile retrieved successfully
          examples:
            application/json:
              success: true
              data:
                id: 123e4567-e89b-12d3-a456-426614174000
                first_name: John Doe
                email: john.doe@university.edu.gh
                phone: '+233201234567'
                avatar: ''
                profile_pic: https://example.com/profile.jpg
                avatarUrl: https://example.com/profile.jpg
                student_id: UGBS123456
                campus: Legon
                university: University of Ghana
                is_student: true
                is_verified: true
                kyc_status: approved
                role: user
                rating: 4.5
                total_reviews: 10
                bio: Computer Science student passionate about tech and entrepreneurship.
                member_since: '2024-01-01T00:00:00Z'
                has_store: false
                has_restaurant: false
                response_rate: 95%
                response_time: 2 hours
        '401':
          description: Unauthorized
          examples:
            application/json:
              success: false
              errors:
                detail: Authentication credentials were not provided.
        '403':
          description: Forbidden
          examples:
            application/json:
              success: false
              errors:
                detail: You do not have permission to perform this action.
      tags:
      - User Management
      security:
      - Bearer: []
    put:
      operationId: users_me_update
      summary: Update User Profile
      description: Update authenticated user's profile information.
      parameters:
      - name: firstName
        in: formData
        required: false
        type: string
        minLength: 1
      - name: lastName
        in: formData
        required: false
        type: string
        minLength: 1
      - name: phone
        in: formData
        description: Enter phone number without letters
        required: false
        type: string
        maxLength: 20
        x-nullable: true
      - name: campus
        in: formData
        required: true
        type: string
        maxLength: 100
        minLength: 1
      - name: bio
        in: formData
        required: false
        type: string
        x-nullable: true
      - name: avatar
        in: formData
        description: Profile picture image file (max 100MB)
        required: false
        type: file
      responses:
        '200':
          description: Profile updated successfully
          schema:
            type: object
            properties:
              success:
                type: boolean
              message:
                type: string
              data:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    example: 123e4567-e89b-12d3-a456-426614174000
                  first_name:
                    type: string
                    example: John Doe Updated
                  email:
                    type: string
                    format: email
                    example: john.doe@university.edu.gh
                  phone:
                    type: string
                    example: '+233201234568'
                  avatar:
                    type: string
                    example: ''
                  profile_pic:
                    type: string
                    format: uri
                    example: https://res.cloudinary.com/cloud_name/image/upload/v123/user_avatar_123.jpg
                  avatarUrl:
                    type: string
                    format: uri
                    example: https://res.cloudinary.com/cloud_name/image/upload/v123/user_avatar_123.jpg
                  student_id:
                    type: string
                    example: UGBS123456
                  campus:
                    type: string
                    example: Legon
                  university:
                    type: string
                    example: University of Ghana
                  is_student:
                    type: boolean
                    example: true
                  is_verified:
                    type: boolean
                    example: true
                  kyc_status:
                    type: string
                    enum:
                    - not_submitted
                    - pending
                    - approved
                    - rejected
                    example: approved
                  role:
                    type: string
                    enum:
                    - user
                    - admin
                    - delivery
                    example: user
                  rating:
                    type: number
                    format: float
                    example: 4.5
                  total_reviews:
                    type: integer
                    example: 10
                  bio:
                    type: string
                    example: Updated bio with more details...
                  member_since:
                    type: string
                    format: date-time
                    example: '2024-01-01T00:00:00Z'
                  has_store:
                    type: boolean
                    example: false
                  has_restaurant:
                    type: boolean
                    example: false
                  response_rate:
                    type: string
                    example: 95%
                  response_time:
                    type: string
                    example: 2 hours
                  cloudinaryPublicId:
                    type: string
                    example: user_avatars/user_avatar_123
        '400':
          description: Validation error
          schema:
            type: object
            properties:
              success:
                type: boolean
              errors:
                type: object
          examples:
            application/json:
              success: false
              errors:
                phone:
                - This phone number is already in use.
        '429':
          description: Rate limit exceeded
          schema:
            type: object
            properties:
              success:
                type: boolean
              errors:
                type: object
                properties:
                  detail:
                    type: string
          examples:
            application/json:
              success: false
              errors:
                detail: Too many profile updates. Please try again later.
      consumes:
      - multipart/form-data
      - application/json
      tags:
      - User Management
      security:
      - Bearer: []
    patch:
      operationId: users_me_partial_update
      summary: Partial Update User Profile
      description: Partially update profile. Only provided fields will be updated.
      parameters:
      - name: data
        in: body
        required: true
        schema:
          $ref: '#/definitions/UpdateProfile'
      responses:
        '200':
          description: Profile updated successfully
          examples:
            application/json:
              success: true
              message: Profile updated successfully
              data:
                id: 123e4567-e89b-12d3-a456-426614174000
                first_name: John Doe Updated
                email: john.doe@university.edu.gh
                phone: '+233201234568'
                profile_pic: https://res.cloudinary.com/.../user_avatar_123.jpg
                campus: Legon
                bio: Updated bio...
                is_verified: true
                role: user
                rating: 4.5
                member_since: '2024-01-01T00:00:00Z'
        '400':
          description: Validation error
        '429':
          description: Rate limit exceeded
      tags:
      - User Management
    parameters: []
  /users/me/avatar/:
    post:
      operationId: users_me_avatar_create
      summary: Upload User Avatar
      description: |2

        Upload a new profile picture to Cloudinary.

        ### Requirements:
        - Max file size: 10MB
        - Supported formats: JPG, JPEG, PNG, GIF, WebP
        - Multipart form data required
        - Authentication required (HTTP-only JWT cookie)

        ### Transformations Applied:
        - Width: 400px, Height: 400px
        - Crop: fill with 'face' gravity for smart cropping
        - Format: auto-optimized
        - Quality: auto-optimized

        ### Response Includes:
        - Direct Cloudinary URL for the uploaded avatar
        - Public ID for reference
        - Image dimensions (width x height)
        - File format and size in bytes
        - Upload timestamp
      parameters:
      - name: avatar
        in: formData
        description: Profile picture file (JPG, PNG, GIF, WebP - max 10MB)
        required: true
        type: file
      responses:
        '200':
          description: Avatar uploaded successfully
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              message:
                type: string
                example: Avatar uploaded successfully
              data:
                type: object
                properties:
                  avatarUrl:
                    type: string
                    example: https://res.cloudinary.com/xyz/image/upload/v123/user_avatars/user_avatar_abc.jpg
                  publicId:
                    type: string
                    example: user_avatars/user_avatar_abc
                  width:
                    type: integer
                    example: 400
                  height:
                    type: integer
                    example: 400
                  format:
                    type: string
                    example: jpg
                  bytes:
                    type: integer
                    example: 51234
                  folder:
                    type: string
                    example: user_avatars
                  uploadedAt:
                    type: string
                    format: date-time
                    example: '2024-01-15T10:30:00.00Z'
          examples:
            application/json:
              success: true
              message: Avatar uploaded successfully
              data:
                avatarUrl: https://res.cloudinary.com/xyz/image/upload/v123/user_avatars/user_avatar_abc.jpg
                publicId: user_avatars/user_avatar_abc
                width: 400
                height: 400
                format: jpg
                bytes: 51234
                folder: user_avatars
                uploadedAt: '2024-01-15T10:30:00.00Z'
        '400':
          description: Bad Request - Validation Error
          examples:
            application/json:
            - success: false
              error: no_file_provided
              message: No avatar file provided
            - success: false
              error: file_too_large
              message: File size must be less than 10MB
            - success: false
              error: invalid_file_type
              message: 'Invalid file type. Allowed: jpg, jpeg, png, gif, webp'
        '401':
          description: Unauthorized - Authentication required
          examples:
            application/json:
              success: false
              message: Unauthorized - Please ensure HTTP-only JWT cookie is set
        '413':
          description: Payload Too Large
          examples:
            application/json:
              success: false
              error: file_too_large
              message: File size must be less than 10MB
        '415':
          description: Unsupported Media Type
          examples:
            application/json:
              success: false
              error: invalid_file_type
              message: 'Invalid file type. Allowed: jpg, jpeg, png, gif, webp'
        '429':
          description: Too Many Requests - Rate limit exceeded
          examples:
            application/json:
              success: false
              error: rate_limit_exceeded
              message: Too many upload attempts. Please try again in 1 hour.
        '500':
          description: Internal Server Error
          examples:
            application/json:
              success: false
              error: upload_failed
              message: Failed to upload avatar to Cloudinary
      consumes:
      - multipart/form-data
      tags:
      - User Management
    parameters: []
  /users/{userId}/:
    get:
      operationId: users_read
      summary: Get User Public Profile
      description: |2

        Get public profile information tailored to user's role.

        ### Information by Role:

        **For All Users:**
        - Basic identity (name, avatar)
        - Rating and review count
        - Member since date

        **Additional for Sellers:**
        - Response rate and time
        - Store information
        - University/campus

        **Additional for Delivery Partners:**
        - Response rate and time
        - Delivery statistics
        - University/campus

        **For Buyers:**
        - Only basic information (privacy focused)

        ### Privacy Rules:
        - Email and phone never exposed
        - Student ID never exposed
        - Personal bio only if public
        - KYC status only shows 'verified' (not pending/rejected)

        ### Rate Limiting:
        Limited to 100 user profile views per hour per authenticated user.
      parameters:
      - name: userId
        in: path
        description: User's UUID
        required: true
        type: string
        format: uuid
      - name: fields
        in: query
        description: 'Optional: Comma-separated fields to include'
        required: false
        type: string
        enum:
        - basic
        - extended
        - all
        default: basic
      responses:
        '200':
          description: User profile retrieved
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  id:
                    type: string
                  firstName:
                    type: string
                  lastName:
                    type: string
                  avatar:
                    type: string
                  rating:
                    type: number
                  totalReviews:
                    type: integer
                  memberSince:
                    type: string
                  role:
                    type: string
                  isVerified:
                    type: boolean
                  hasStore:
                    type: boolean
                    nullable: true
                  hasRestaurant:
                    type: boolean
                    nullable: true
                  responseRate:
                    type: string
                    nullable: true
                  responseTime:
                    type: string
                    nullable: true
                  university:
                    type: string
                    nullable: true
                  campus:
                    type: string
                    nullable: true
        '404':
          description: User not found
        '429':
          description: Too many requests
      tags:
      - User Management
    parameters:
    - name: userId
      in: path
      required: true
      type: string
definitions:
  _KYCAction:
    required:
    - action
    type: object
    properties:
      action:
        title: Action
        type: string
        enum:
        - approve
