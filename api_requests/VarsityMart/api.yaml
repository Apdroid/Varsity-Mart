  /auth/verify-email/:
    post:
      operationId: auth_verify-email_create
      summary: Verify Email Address
      description: |2

        Verify user's email address using the 6-digit OTP code.

        ### Important Security Notes:
        - User must verify within 3 hours or account will be deleted
        - Verification code expires in 24 hours
        - Maximum 10 verification attempts before rate limiting
        - Account cleanup runs every 15 minutes via Celery

        ### After Successful Verification:
        - Email is marked as verified (`is_verified=True`)
        - 3-hour account expiry timer is cleared
        - Verification code and expiry are cleared
        - User gains access to verified-only features

        ### Account Expiry Warning:
        If user doesn't verify within 3 hours:
        - Account is automatically deleted via Celery task
        - Email address becomes available for re-registration
        - All user data is permanently removed
      parameters:
      - name: data
        in: body
        required: true
        schema:
          required:
          - verification_code
          type: object
          properties:
            verification_code:
              description: 6-digit OTP verification code received via email
              type: string
              pattern: ^[0-9]{6}$
              example: '123456'
              maxLength: 6
              minLength: 6
          example:
            verification_code: '123456'
      responses:
        '200':
          description: Email verified successfully
          examples:
            application/json:
              success: true
              message: Email verified successfully
              data:
                isVerified: true
                email: student@university.edu.gh
                verifiedAt: '2024-01-15T10:30:00Z'
                accountExpiryCleared: true
                userId: uuid-here
        '400':
          description: Bad Request - Validation Error
          examples:
            application/json:
            - success: false
              message: Invalid code format. Must be 6 digits
            - success: false
              message: No verification code found
            - success: false
              message: Verification code has expired
            - success: false
              message: Email is already verified
            - success: false
              message: Invalid code. 9 attempts remaining
        '429':
          description: Too Many Requests
          examples:
            application/json:
              success: false
              message: Too many verification attempts. Please request a new code.
        '410':
          description: Account Expired - Deleted
          examples:
            application/json:
              success: false
              message: Account has been deleted due to non-verification. Please register
                again.
      tags:
      - Authentication
      security:
      - Bearer: []
    parameters: []
