name: CI

on:
  push:
    branches: [main, super]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # Public values only. The build bakes NEXT_PUBLIC_* in, so use placeholders in CI.
      NEXT_PUBLIC_API_URL: https://api.varsitymart.org/v1
      NEXT_PUBLIC_WS_URL: wss://api.varsitymart.org
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
